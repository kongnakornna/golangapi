services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "wait-for-it -w db:5435 -w redis:6379 -w elasticsearch:9200 -- go run main.go migrate && go run main.go initdata && air -c .air.toml.linux serve"
    ports:
      - ${SERVER_PORT:-5000}:${SERVER_PORT:-5000}
    volumes:
      - ./:/app
    environment:
      - POSTGRES_HOST=db
      - REDIS_ADDR=redis:6379
      - TASK_REDIS_ADDR=redis:6379
      - LLM_BASE_URL=http://ollama:11434/v1
      - ICMON_MQTT_BROKER=mqtt://mqtt:1883
      - ICMON_MQTT_PORT=1883
      - ELASTICSEARCH_ADDRESSES=http://elasticsearch:9200
      - INFLUXDB_URL=http://influxdb:8086
    depends_on:
      - db
      - redis
      - elasticsearch
      - ollama
      - mqtt
      - influxdb
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "wait-for-it -w db:5435 -w redis:6379 -- sleep 10; go run main.go worker"
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    environment:
      - POSTGRES_HOST=db
      - REDIS_ADDR=redis:6379
      - TASK_REDIS_ADDR=redis:6379
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DBNAME}
    command: ["postgres", "-p", "5435"]
    ports:
      - "5435:5435"
    volumes:
      - ./app-postgres-data:/var/lib/postgresql/data/
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - 6379
    volumes:
      - app-redis-data:/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.1
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - app-kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:9092", "--web.listen-address=:9308"]
    expose:
      - 9308
    depends_on:
      - kafka
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - app-prometheus-data:/prometheus
    depends_on:
      - kafka-exporter
      - redis-exporter
      - postgres-exporter
      - blackbox-exporter
      - mosquitto-exporter
      - influxdb
      - elasticsearch-exporter
      - ollama-exporter
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    command: ["--redis.addr=redis:6379"]
    expose:
      - 9121
    depends_on:
      - redis
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/${POSTGRES_DBNAME}?sslmode=disable
    expose:
      - 9187
    depends_on:
      - db
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    expose:
      - 9115
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - network.host=0.0.0.0
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ingest.geoip.downloader.enabled=false
    ports:
      - 9200:9200
    volumes:
      - app-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    command:
      - "--es.uri=http://elasticsearch:9200"
      - "--es.all"
      - "--es.indices"
    expose:
      - 9114
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - 5001:5000
      - 5044:5044
      - 9600:9600
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
    ports:
      - 5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - 1885:1883
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - app-mqtt-data:/mosquitto/data
    restart: unless-stopped

  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:latest
    command: ["--endpoint=tcp://mqtt:1883", "--bind-address=0.0.0.0:9234"]
    expose:
      - 9234
    depends_on:
      - mqtt
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports:
      - 9087:8086
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-admin}
      - DOCKER_INFLUXDB_INIT_ORG=cmon_org
      - DOCKER_INFLUXDB_INIT_BUCKET=AIRCOM1
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-NrQIxbV5FdcAoV6DSzAUCA0P-NMTLuTjptbH53q6kNg1RPOwva4qH0o3DrZcb9ELuBDUDbfhhk-OT1kiTMFQMw==}
    volumes:
      - ./influxdb/entrypoint.sh:/entrypoint-custom.sh:ro
      - app-influxdb-data:/var/lib/influxdb2
    entrypoint:
      - sh
      - /entrypoint-custom.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - app-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ollama-exporter:
    build:
      context: .
      dockerfile: Dockerfile.ollama-exporter
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LISTEN_ADDR=:9309
    expose:
      - 9309
    depends_on:
      - ollama
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      - PORT=8001
      - AI_TIMEOUT=300s
    ports:
      - 8001:8001
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - app-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  app-postgres-data:
  app-redis-data:
  app-kafka-data:
  app-prometheus-data:
  app-grafana-data:
  app-elasticsearch-data:
  app-mqtt-data:
  app-influxdb-data:
  app-ollama-data: