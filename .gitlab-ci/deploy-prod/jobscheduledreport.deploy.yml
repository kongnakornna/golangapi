jobscheduledreport-prod-deploy:
  extends: .cronjob-kube-prod
  before_script:
    # Overwrite this value globally.
    - APP_NAME=jobscheduledreport

    # Export them for all jobs.
    - export APP_NAME

    - export MIN_REPLICAS=3
    - export MAX_REPLICAS=9
    - export CPU_LIMIT="1500m"
    - export MEMORY_LIMIT="1536Mi"
    - export JOB_DURATION="*/2 * * * *"
