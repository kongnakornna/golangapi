reportemployeekpi-prod-deploy:
  stage: deploy-prod
  extends: .deploy-kube-prod
  before_script:
    # Overwrite this value globally.
    - APP_NAME=reportemployeekpi

    # Export them for all jobs.
    - export APP_NAME

    - export MIN_REPLICAS=3
    - export MAX_REPLICAS=9
    - export CPU_LIMIT="1500m"
    - export MEMORY_LIMIT="1536Mi"
    - export APP_BASE_PATH=/reporting/employee-kpis
