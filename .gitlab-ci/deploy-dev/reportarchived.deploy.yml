reportarchived-dev-deploy:
  #  stage: deploy-dev
  extends: .deploy-kube-dev
  before_script:
    # Overwrite this value globally.
    - APP_NAME=reportarchived

    # Export them for all jobs.
    - export APP_NAME

    - export MIN_REPLICAS=1
    - export MAX_REPLICAS=1
    - export CPU_LIMIT="300m"
    - export MEMORY_LIMIT="512Mi"
    - export APP_BASE_PATH=/reporting/archived-report
  only:
    changes:
      - .gitlab-ci/build/build-dev.yml
      - .gitlab-ci/build/reportarchived.build.yml
      - .gitlab-ci/deploy-dev/deploy-dev.yml
      - .gitlab-ci/deploy-dev/reportarchived.deploy.yml
      - api/**/*.go
      - cmd/reportarchived/*.go
      - build/develop/Dockerfile
      - config/**/*
      - deployments/deployment.yml
      - docs/**/*
      - pkg/**/*.go
      - vendor/**/*
