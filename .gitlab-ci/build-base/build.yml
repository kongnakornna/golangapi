build-base:
  stage: build-base
  image: harborregistryii.thaibevapp.com/baseimage/docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false", "--insecure-registry=harborregistryii.thaibevapp.com"]
  before_script:
    - apk add --no-cache jq curl docker-cli
    - export ROBOT_NAME=$(cat $HARBOR_ROBOT_FILE | jq -r '.name')
    - export ROBOT_SECRET=$(cat $HARBOR_ROBOT_FILE | jq -r '.secret')
    - echo "$ROBOT_SECRET" | docker login --username "$ROBOT_NAME" --password-stdin "$HARBOR_REGISTRY" 
    
  script:
    - export IMAGE_TAG=${HARBOR_REGISTRY}/baseimage/${HARBOR_PROJECT}/${HARBOR_APP_NAME}:base
    - docker build -t $IMAGE_TAG -f ${DOCKERFILE_BASEIMAGE} .
    - docker push $IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

    - if: '$CI_COMMIT_BRANCH =~ /^(dev|uat|master)$/'
      changes:
        - go.mod
        - go.sum
        - build/develop/Dockerfile.base
        