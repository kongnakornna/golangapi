.build-tag:
  stage: build-tag
  image: harborregistryii.thaibevapp.com/baseimage/docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false", "--insecure-registry=harborregistryii.thaibevapp.com"]
  script:
    # Registry images.
    - export IMAGE_TAG=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_APP_NAME}/$APP_NAME:$COMMIT_ID
    - docker build --build-arg APP_NAME=$APP_NAME -t $IMAGE_TAG -f ${DOCKERFILE_SERVICE} .
    - docker push $IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^dev-\d+\.\d+\.\d+$/'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^uat-\d+\.\d+\.\d+$/'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never
  # only:
  #   - /^\d+\.\d+\.\d+$/

