  /mqtt/gettopicdata:
    get:
      consumes:
      - application/json
      description: |-
        Subscribes to the given topic, waits for a single message, then unsubscribes. Caches the result for 60 seconds.
        On MQTT timeout the endpoint returns fallback data with HTTP 504 (see `error_detail` / `from:fallback`).
      parameters:
      - description: MQTT topic name (e.g. BAACTW05/DATA)
        in: query
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_presenter.MQTTTopicDataResponse'
        "400":
          description: missing topic parameter
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_delivery_http.errResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_presenter.MQTTTopicDataResponse'
        "503":
          description: MQTT broker not connected
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_presenter.MQTTTopicDataResponse'
        "504":
          description: MQTT timeout (fallback data returned)
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_presenter.MQTTTopicDataResponse'
