  /iot/topic:
    get:
      consumes:
      - application/json
      description: |-
        Subscribes to the given topic, waits for a single message, then unsubscribes. Caches the result for 60 seconds.
        Use &delcache=1 to force deletion of the cached value and fetch a fresh payload.
      parameters:
      - description: MQTT topic name (e.g. BAACTW05/DATA)
        in: query
        name: topic
        required: true
        type: string
      - description: Delete cache (1 to delete)
        enum:
        - "1"
        in: query
        name: delcache
