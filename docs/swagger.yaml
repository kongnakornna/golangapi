  /ws:
    get:
      consumes:
      - application/json
      description: 'Upgrades an HTTP connection to WebSocket. Clients send JSON envelopes
        with "type": subscribe | unsubscribe | join_room | leave_room | message and
        a "topic" or "room". MQTT messages are broadcast to clients joined to the
        room named by the first segment of the MQTT topic (e.g. topic BAACTW05/DATA
        -> room BAACTW05); queue messages are delivered to topic subscribers. Server
        frames look like {"event":"...","data":...}.'
      parameters:
      - description: Bearer token for authentication (or Authorization header)
        in: query
        name: token
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
      security:
      - OAuth2Password: []
      - BearerAuth: []
      summary: WebSocket endpoint (real-time MQTT/IoT stream)
      tags:
      - websocket
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer " followed by your access token. Example: "Bearer eyJhbGciOiJSUzI1NiIs..."'
    in: header
    name: Authorization
    type: apiKey
  OAuth2Password:
    flow: password
    scopes:
      read: Grants read access
      write: Grants write access
    tokenUrl: /api/auth/login
    type: oauth2
swagger: "2.0"
