info:
  contact: {}
  description: API for ICMON project
  title: Go IoT API
  version: "1.0"
paths:
  /alarm/validate:
    post:
      consumes:
      - application/json
      description: Calculates alarm level, title, subject, content and control messages
        based on sensor data and thresholds. Uses Thai language messages.
      parameters:
      - description: Alarm input data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helpers.AlarmDetailDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.AlarmDetailResult'
        "400":
          description: invalid JSON body
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_alarm_delivery_http.errResponse'
      security:
      - BearerAuth: []
      summary: Validate alarm status (default Thai)
      tags:
      - alarm
  /alarm/validate/en:
    post:
      consumes:
      - application/json
      description: Same as /validate but uses English messages.
      parameters:
      - description: Alarm input data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helpers.AlarmDetailDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.AlarmDetailResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_alarm_delivery_http.errResponse'
      security:
      - BearerAuth: []
      summary: Validate alarm status (English)
      tags:
      - alarm
  /alarm/validate/th:
    post:
      consumes:
      - application/json
      description: Same as /validate but explicitly uses Thai messages.
      parameters:
      - description: Alarm input data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helpers.AlarmDetailDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.AlarmDetailResult'
        "400":
          description: Bad Request
          schema:
